<div class="app">
  <nav class="side" aria-label="Systems">
    <div class="brand"><img src="icons/icon.svg" alt=""><span>Drifter<small>Boat Systems</small></span></div>
    <div id="sideNav"></div>
    <div class="spacer"></div>
    <a href="#system" data-page="system"><svg class="i"><use href="#i-gear"/></svg><span>System</span></a>
    <div class="foot" id="sideFoot"></div>
  </nav>
  <div class="main">
    <header class="top" id="top">
      <h1 id="title">Overview<span class="sub" id="subtitle"></span></h1>
      <button class="iconbtn" id="themeBtn" type="button" aria-label="Theme"><svg class="i"><use href="#i-sun"/></svg></button>
      <a class="iconbtn" href="#system" aria-label="System and display settings" id="gearBtn"><svg class="i"><use href="#i-gear"/></svg></a>
    </header>
    <main class="content" id="content">
      <div class="alarmbar" id="alarmbar" role="alert">
        <svg class="i"><use href="#i-alert"/></svg>
        <div class="grow"><b id="alarmTitle"></b><span id="alarmSub"></span></div>
        <button class="btn sm" id="alarmSilence" type="button">Silence</button>
        <button class="btn sm" type="button" data-sound aria-pressed="false" title="Sound alarms on this device">Sound off</button>
      </div>
      <div id="pages"></div>
    </main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Systems"></nav>

<div class="scrim" id="dialog" aria-hidden="true"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" id="dlgSheet"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
